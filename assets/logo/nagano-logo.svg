<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 860" width="1220" height="860">
  <title>NAGANO Logo - Layered Source</title>

  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf9f4"/>
      <stop offset="100%" stop-color="#f4f1e9"/>
    </linearGradient>

    <radialGradient id="dawnGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3d3d8"/>
      <stop offset="100%" stop-color="#aebfc6"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c6bd"/>
      <stop offset="100%" stop-color="#8fb3a8"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbf9e"/>
      <stop offset="100%" stop-color="#6fa686"/>
    </linearGradient>

    <radialGradient id="leafGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a9d6ab"/>
      <stop offset="100%" stop-color="#6fa871"/>
    </radialGradient>
    <radialGradient id="fruitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffc79a"/>
      <stop offset="100%" stop-color="#f0925a"/>
    </radialGradient>

    <linearGradient id="logoGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#8fe0ab"/>
      <stop offset="45%" stop-color="#4dc57e"/>
      <stop offset="100%" stop-color="#1f8a52"/>
    </linearGradient>
    <radialGradient id="logoGloss" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="logoRingClip">
      <path d="M474.7,164.7 A190,190 0 1,1 474.7,435.3 L474.7,300 Z
               M745.3,424.7 A190,190 0 1,1 745.3,695.3 L745.3,560 Z
               M420,365 H800 V495 H420 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1220" height="860" fill="url(#paperGrad)"/>

  <g id="background-mountain">
    <rect x="0" y="0" width="1220" height="860" fill="url(#dawnGlow)"/>
    <path d="M0,560 C160,470 260,510 360,455 C460,400 520,470 640,430
             C760,390 840,460 980,420 C1080,392 1160,430 1220,410
             L1220,860 L0,860 Z" fill="url(#mountainFar)" opacity="0.55"/>
    <path d="M0,620 C140,545 240,590 340,545 C450,495 540,560 660,520
             C780,480 860,540 990,505 C1080,480 1160,510 1220,495
             L1220,860 L0,860 Z" fill="url(#mountainMid)" opacity="0.6"/>
    <path d="M0,700 C120,635 220,670 320,635 C430,595 520,650 650,615
             C770,582 850,630 970,600 C1070,575 1150,600 1220,588
             L1220,860 L0,860 Z" fill="url(#mountainNear)" opacity="0.65"/>
  </g>

  <g id="background-tree">
    <path d="M1070,760 C1066,700 1072,650 1062,600" fill="none"
          stroke="#7a8f5c" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <g opacity="0.85">
      <circle cx="1050" cy="600" r="46" fill="url(#leafGrad)"/>
      <circle cx="1105" cy="585" r="52" fill="url(#leafGrad)"/>
      <circle cx="1150" cy="620" r="40" fill="url(#leafGrad)"/>
      <circle cx="1090" cy="640" r="44" fill="url(#leafGrad)"/>
      <circle cx="1035" cy="650" r="34" fill="url(#leafGrad)"/>
      <circle cx="1140" cy="670" r="32" fill="url(#leafGrad)"/>
    </g>
    <g opacity="0.9">
      <circle cx="1040" cy="630" r="12" fill="url(#fruitGrad)"/>
      <circle cx="1100" cy="655" r="13" fill="url(#fruitGrad)"/>
      <circle cx="1145" cy="640" r="11" fill="url(#fruitGrad)"/>
      <circle cx="1080" cy="600" r="10" fill="url(#fruitGrad)"/>
      <circle cx="1125" cy="605" r="9" fill="url(#fruitGrad)"/>
    </g>
  </g>

  <g id="wireframe" opacity="0.55" fill="none" stroke="#2b2b2b">
    <circle cx="310" cy="195" r="150" stroke-width="1.2"/>
    <circle cx="310" cy="195" r="108" stroke-width="1"/>
    <line x1="60" y1="195" x2="560" y2="195" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="310" y1="20" x2="310" y2="370" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="110" y1="330" x2="500" y2="40" stroke-width="1.4"/>
    <line x1="130" y1="345" x2="520" y2="55" stroke-width="1.4"/>
    <line x1="150" y1="360" x2="540" y2="70" stroke-width="1.4"/>
    <g fill="#3f9d5c" stroke="none">
      <circle cx="110" cy="330" r="4.5"/>
      <circle cx="500" cy="40" r="4.5"/>
      <circle cx="310" cy="195" r="4.5"/>
      <circle cx="450" cy="150" r="4.5"/>
      <circle cx="160" cy="290" r="4.5"/>
    </g>
    <g font-family="Consolas, monospace" font-size="12" fill="#3a3a3a" stroke="none">
      <text x="452" y="145">(05, 325, 2700)</text>
      <text x="80" y="300">(02, 525, 2378)</text>
    </g>
  </g>

  <g id="logo-symbol">
    <path d="M474.7,164.7 A190,190 0 1,1 474.7,435.3"
          fill="none" stroke="url(#logoGrad)" stroke-width="130" stroke-linecap="round"/>
    <path d="M745.3,424.7 A190,190 0 1,1 745.3,695.3"
          fill="none" stroke="url(#logoGrad)" stroke-width="130" stroke-linecap="round"/>
    <rect x="420" y="365" width="380" height="130" fill="url(#logoGrad)"/>
    <ellipse cx="520" cy="220" rx="140" ry="90" fill="url(#logoGloss)"
             clip-path="url(#logoRingClip)"/>
  </g>

  <g id="logo-slits" transform="rotate(-35 610 430)">
    <rect x="500" y="-200" width="16" height="1260" fill="#12401f" opacity="0.9"/>
    <rect x="560" y="-200" width="22" height="1260" fill="#155428" opacity="0.9"/>
    <rect x="606" y="-200" width="22" height="1260" fill="#1a6b31" opacity="0.9"/>
  </g>

  <g id="logo-text">
    <text x="610" y="450" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-weight="700" font-size="66" letter-spacing="2" fill="#ffffff">NAGANO</text>
  </g>

  <g id="ui-overlay" opacity="0.5">
    <rect x="260" y="520" width="700" height="300" rx="22" fill="#e7e9ec"/>
    <rect x="284" y="544" width="652" height="70" rx="10" fill="#ffffff"/>
    <text x="900" y="588" text-anchor="end" font-family="Consolas, monospace"
          font-size="28" fill="#333333">0</text>
    <g fill="#f4f5f6" stroke="#d6d8db" stroke-width="1">
      <rect x="284" y="628" width="148" height="52" rx="8"/>
      <rect x="446" y="628" width="148" height="52" rx="8"/>
      <rect x="608" y="628" width="148" height="52" rx="8"/>
      <rect x="770" y="628" width="148" height="52" rx="8"/>
      <rect x="284" y="692" width="148" height="52" rx="8"/>
      <rect x="446" y="692" width="148" height="52" rx="8"/>
      <rect x="608" y="692" width="148" height="52" rx="8"/>
      <rect x="770" y="692" width="148" height="52" rx="8"/>
    </g>
  </g>
</svg>
